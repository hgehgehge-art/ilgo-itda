<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책장 — 읽고, 잇다</title>
  <meta name="description" content="한국외대 해외문학회의 책장(대출 상태)과 주간 세미나 참석 신청">
  <script>document.documentElement.classList.add('js');</script>
  <link rel="stylesheet" href="assets/css/style.css">
  <script type="module" src="assets/js/site.js"></script>
  <script type="module" src="assets/js/quote.js"></script>
  <script type="module" src="assets/js/books.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">본문으로 건너뛰기</a>

  <header class="site-nav">
    <nav class="container" aria-label="주 메뉴">
      <a class="brand" href="index.html">읽고, 잇다</a>
      <ul class="nav-links">
        <li><a href="index.html">홈</a></li>
        <li><a href="books.html" aria-current="page">책장</a></li>
        <li><a href="seminars.html">세미나</a></li>
      </ul>
    </nav>
  </header>
  <div id="quote-banner" class="quote-banner" hidden></div>

  <main id="main">
    <section class="section page-head" aria-labelledby="books-title">
      <div class="container">
        <p class="eyebrow">민음사 세계문학전집</p>
        <h1 class="headline" id="books-title">책장</h1>
        <p class="lead">동아리가 소장한 책을 찾고, 지금 빌릴 수 있는지 확인하세요. 대출·반납은 동아리방에서 운영진에게 요청합니다.</p>
        <p class="sync-note"><span id="book-synced">불러오는 중…</span><br>대출 상태는 최대 30분 늦게 반영될 수 있습니다.</p>
        <p class="example-note" id="book-example" hidden>지금 보이는 목록은 화면 확인용 예시 데이터입니다. 실제 소장 목록과 대출 상태가 아닙니다.</p>
      </div>
    </section>

    <section class="section section--tight" aria-label="도서 목록">
      <div class="container">
        <form class="search" id="book-search" role="search">
          <label class="visually-hidden" for="book-query">책 검색</label>
          <input class="search-input" id="book-query" type="search" placeholder="제목, 작가, 권번호로 찾기" autocomplete="off">
          <label class="check">
            <input type="checkbox" id="only-available">
            <span>대출 가능한 책만</span>
          </label>
        </form>
        <p class="result-count" id="book-count" role="status" aria-live="polite"></p>
        <ul class="books" id="book-list"></ul>
        <div class="center">
          <button class="btn btn--quiet" type="button" id="book-more" hidden>더 보기</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>읽고, 잇다 — 한국외대 해외문학회 개인 프로젝트</p>
      <p>오늘의 한 문장 출처: <a href="https://github.com/gwongibeom/korean-advice-open-api">한국어 명언 API</a></p>
    </div>
  </footer>
</body>
</html>
