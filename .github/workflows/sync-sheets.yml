name: 시트 동기화

on:
  schedule:
    # 30분마다. 예약 실행은 늦어질 수 있다.
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sheets
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 0 성공 / 1 실패(파일 변경 없음) / 3 일부 실패(바뀐 파일은 저장됨)
      - name: 시트 읽어 데이터 갱신
        id: sync
        run: |
          set +e
          node scripts/sync-sheets.mjs
          echo "code=$?" >> "$GITHUB_OUTPUT"
        env:
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          SEMINAR_SHEET_ID: ${{ secrets.SEMINAR_SHEET_ID }}
          LOAN_SHEET_ID: ${{ secrets.LOAN_SHEET_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: 바뀐 경우에만 커밋
        if: steps.sync.outputs.code == '0' || steps.sync.outputs.code == '3'
        run: |
          git add data/seminars.json data/books.json
          if git diff --cached --quiet; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "시트 동기화"
          # 오늘의 한 문장 커밋과 겹칠 수 있어 최신으로 맞춘 뒤 올린다
          git pull --rebase
          git push

      - name: 실패 표시
        if: steps.sync.outputs.code != '0'
        run: |
          echo "동기화에 실패한 부분이 있습니다. 위 기록의 error 줄을 확인하세요."
          exit 1
